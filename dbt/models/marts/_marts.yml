version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension, one row per date, conformed across every fact table.
      Carries `est_jour_ouvrable` so attendance and leave metrics share one
      definition of a working day instead of each re-deriving it.
    columns:
      - name: date_id
        description: Surrogate key, YYYYMMDD as an integer.
        tests: [unique, not_null]
      - name: date_complete
        tests: [unique, not_null]
      - name: est_jour_ouvrable
        description: >
          True when the date is Monday-Friday and not a non-working public
          holiday. The denominator for every attendance rate.
        tests: [not_null]
      - name: jour_semaine_num
        description: ISO day of week, 1 = Monday.
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: dim_employe
    description: >
      Employee dimension, Type 1. Denormalised with department and manager so
      reports can slice without a second join. Tenure and age are recomputed at
      build time so they never go stale.
    columns:
      - name: employe_id
        tests: [unique, not_null]
      - name: matricule
        tests: [unique, not_null]
      - name: departement_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: departement_id
      - name: tranche_anciennete
        tests:
          - accepted_values:
              arguments:
                values: ["< 1 an", "1-3 ans", "3-5 ans", "5 ans +"]

  - name: dim_departement
    columns:
      - name: departement_id
        tests: [unique, not_null]
      - name: nom_departement
        tests: [not_null]

  - name: fct_pointage
    description: "Grain: one row per employee per worked day."
    columns:
      - name: pointage_id
        tests: [unique, not_null]
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: employe_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employe')
                field: employe_id
      - name: retard_minutes
        description: Minutes late. Never negative - an early arrival is zero.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 600

  - name: fct_absence
    description: >
      Grain: one row per absence event. Absences falling on a public holiday
      are flagged rather than dropped, so the data-quality issue stays visible
      instead of inflating the absence rate silently.
    columns:
      - name: absence_id
        tests: [unique, not_null]
      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: employe_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employe')
                field: employe_id

  - name: fct_conge
    description: >
      Grain: one row per leave request. `nb_jours_corrige` recomputes the days
      charged against the calendar rather than trusting the operational
      system's `nb_jours`, which excluded weekends but not public holidays.
      `ecart_jours` exposes the difference between the two.
    columns:
      - name: conge_id
        tests: [unique, not_null]
      - name: employe_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employe')
                field: employe_id
      - name: nb_jours_corrige
        description: Working days actually covered, holidays excluded.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ["En attente", "Approuvé", "Refusé", "Annulé"]
